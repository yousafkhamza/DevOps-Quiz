        Fetched 12,408 settlement rows from s3://acme-billing/2026-11/
        Wrote report-2026-11.csv
  explanation: "Recent Debian and Ubuntu mark the system Python as externally managed (PEP 668), so a global `pip install` is refused, and `sudo pip` breaks OS tools. Use a venv per project (or `uv`), install from the **pinned** file, and in CI cache the venv or the wheel cache keyed on the hash of `requirements.txt`."

- id: h-term-ansible-001
  category: Ansible
  type: terminal
  title: "Live: roll an nginx change safely"
  host: ops@control
  prompt: "ops@control:~/ansible$"
  scenario: "You changed the nginx template in `site.yml`. Inventory is `inventory.ini` (group `web`: web1, web2). Verify, dry-run on one host, then apply to that host only."
  explore:
    - match: "^ls\\b"
      output: "ansible.cfg  inventory.ini  roles/  site.yml"
    - match: "^cat inventory\\.ini"
      output: |
        [web]
        web1 ansible_host=10.0.4.11
        web2 ansible_host=10.0.4.12
  steps:
    - task: "Check connectivity to **all** hosts in the inventory with the ping module."
      accept: [{ all: ["^ansible (all|web)\\b", "-m (ansible\\.builtin\\.)?ping\\b"] }]
      solution: ansible all -i inventory.ini -m ping
      tool: ansible
      hint: "Ad-hoc: `ansible <pattern> -i <inventory> -m <module>`."
      output: |
        web1 | SUCCESS => { "changed": false, "ping": "pong" }
        web2 | UNREACHABLE! => { "changed": false, "msg": "Failed to connect to the host via ssh: ssh: connect to host 10.0.4.12 port 22: Connection timed out", "unreachable": true }
    - task: "web2 is down for maintenance anyway. Check `site.yml` for syntax errors without running it."
      accept: [{ all: ["^ansible-playbook\\b", "site\\.yml", "--syntax-check"] }]
      solution: ansible-playbook -i inventory.ini site.yml --syntax-check
      tool: ansible-playbook
      output: "playbook: site.yml"
    - task: "Dry-run against **only web1**, showing the file diffs."
      accept: [{ all: ["^ansible-playbook\\b", "site\\.yml", "(--check|-C)\\b", "(--diff|-D)\\b", "(--limit|-l)[ =]?web1\\b"] }]
      solution: ansible-playbook -i inventory.ini site.yml --limit web1 --check --diff
      tool: ansible-playbook
      hint: "Three flags: one to restrict hosts, one for check mode, one to show diffs."
      wrong:
        - match: { all: ["^ansible-playbook", "site\\.yml"], none: ["(--limit|-l)"] }
          output: "# that targets every host in the play — the task says web1 only"
      output: |
        TASK [nginx : render nginx.conf] ***********************************************
        --- before: /etc/nginx/nginx.conf
        +++ after: /home/ops/.ansible/tmp/nginx.conf.j2
        @@ -31,7 +31,7 @@
        -    keepalive_timeout 65;
        +    keepalive_timeout 15;
        changed: [web1]
        RUNNING HANDLER [nginx : reload nginx] *****************************************
        changed: [web1]
        PLAY RECAP *********************************************************************
        web1 : ok=6  changed=2  unreachable=0  failed=0  skipped=0
    - task: "Diff looks right. Apply it for real to **web1** only."
      accept: [{ all: ["^ansible-playbook\\b", "site\\.yml", "(--limit|-l)[ =]?web1\\b"], none: ["(--check|-C)\\b"] }]
      solution: ansible-playbook -i inventory.ini site.yml --limit web1
      tool: ansible-playbook
      output: |
        PLAY RECAP *********************************************************************
        web1 : ok=6  changed=2  unreachable=0  failed=0  skipped=0
  explanation: "Ping proves reachability and auth, `--syntax-check` catches YAML and Jinja errors, and `--check --diff --limit` shows exactly what would change on one canary before you touch the fleet. In a real rollout you'd then use `serial:` in the play (or `--limit web2` later) to go host by host."

- id: h-term-ps-001
  category: PowerShell
  type: terminal
  title: "Live: IIS is down (PowerShell)"
  host: Administrator@WIN-APP01
  prompt: "PS C:\\Users\\Administrator>"
  ignoreCase: true
  scenario: "The legacy partner portal on `WIN-APP01` (IIS) returns nothing on 443 after the weekend's patching. Use PowerShell to find out why and bring it back. Cmdlets are case-insensitive here, as in real PowerShell."
  explore:
    - match: "^get-service$"
      output: |
        Status   Name               DisplayName
        ------   ----               -----------
        Stopped  W3SVC              World Wide Web Publishing Service
        Stopped  WAS                Windows Process Activation Service
        Running  WinRM              Windows Remote Management (WS-Manag...
    - match: "^get-service (-name )?was$"
      output: |
        Status   Name   DisplayName
        ------   ----   -----------
        Stopped  WAS    Windows Process Activation Service
  steps:
    - task: "Check the status of the IIS web service `W3SVC`."
      accept: ["^get-service (-name )?['\"]?w3svc['\"]?$"]
      solution: Get-Service -Name W3SVC
      tool: get-service
      output: |
        Status   Name     DisplayName
        ------   ----     -----------
        Stopped  W3SVC    World Wide Web Publishing Service
    - task: "Read the 5 newest events in the **System** log to see why it stopped."
      accept:
        - { all: ["^get-winevent\\b", "system", "-maxevents ?5\\b"] }
        - { all: ["^get-eventlog\\b", "system", "-newest ?5\\b"] }
      solution: Get-WinEvent -LogName System -MaxEvents 5
      tool: [get-winevent, get-eventlog]
      hint: "`Get-WinEvent -LogName System -MaxEvents 5`"
      output: |
        TimeCreated          Id LevelDisplayName Message
        -----------          -- ---------------- -------
        16/11/2026 06:02:11 7068 Error           The World Wide Web Publishing Service service depends on the Windows Process Activation Service service which failed to start because of the following error: The service cannot be started, either because it is disabled or because it has no enabled devices associated with it.
        16/11/2026 06:02:10 7040 Information     The start type of the Windows Process Activation Service service was changed from auto start to disabled.
    - task: "Set `WAS` back to start automatically."
      accept: [{ all: ["^set-service\\b", "(-name )?['\"]?was['\"]?\\b", "-startuptype ['\"]?automatic['\"]?"] }]
      solution: Set-Service -Name WAS -StartupType Automatic
      tool: set-service
      hint: "`Set-Service -Name <svc> -StartupType Automatic`"
      wrong:
        - match: "^start-service"
          output: "Start-Service : Service 'Windows Process Activation Service (WAS)' cannot be started due to the following error: Cannot start service WAS on computer '.'. (it's still disabled)"
      output: ""
    - task: "Start `W3SVC` (it pulls in WAS as a dependency)."
      accept: ["^start-service (-name )?['\"]?w3svc['\"]?$"]
      solution: Start-Service -Name W3SVC
      tool: [start-service, restart-service]
      output: "WARNING: Waiting for service 'World Wide Web Publishing Service (W3SVC)' to start..."
    - task: "Confirm port **443** answers on localhost."
      accept: [{ all: ["^test-netconnection\\b", "localhost|127\\.0\\.0\\.1|win-app01", "-port ?443\\b"] }]
      solution: Test-NetConnection -ComputerName localhost -Port 443
      tool: test-netconnection
      output: |
        ComputerName     : localhost
        RemoteAddress    : ::1
        RemotePort       : 443
        TcpTestSucceeded : True
  explanation: "Event 7040 shows someone (or a hardening baseline) disabled WAS during patching, and event 7068 shows W3SVC failing on that dependency. `Set-Service -StartupType` then `Start-Service` fixes it, and `Test-NetConnection` is PowerShell's port check. Pin service start types in your configuration (DSC, Ansible `win_service`, GPO) so the next patch run can't undo them."

- id: h-term-docker-002
  category: Docker
  type: terminal
  title: "Live: why is this image 1.4 GB?"
  host: dev@build-01
  prompt: "dev@build-01:~/web$"
  scenario: "The Node.js frontend image `acme/web:2.0` is suddenly 1.4 GB and slow to roll out. Find the fat layer, fix the build context, rebuild as `acme/web:2.1`, and compare."
  explore:
    - match: "^cat Dockerfile"
      output: |
        FROM node:22-alpine AS build
        WORKDIR /app
        COPY . .
        RUN npm ci && npm run build
        FROM nginx:1.27-alpine
        COPY --from=build /app /usr/share/nginx/html
    - match: "^ls( -a| -la| -al)?$"
      output: ".dockerignore  Dockerfile  node_modules/  package.json  package-lock.json  public/  src/"
    - match: "^du -sh node_modules"
      output: "1.1G    node_modules"
  steps:
    - task: "List the local `acme/web` images and their sizes."
      accept: ["^docker (images|image ls)\\b.*acme/web"]
      solution: docker images acme/web
      output: |
        REPOSITORY   TAG   IMAGE ID       CREATED        SIZE
        acme/web     2.0   4e1f7a9b2c3d   20 hours ago   1.42GB
    - task: "Show the layer history of `acme/web:2.0`."
      accept: ["^docker (image )?history\\b.*acme/web:2\\.0"]
      solution: docker history acme/web:2.0
      output: |
        IMAGE          CREATED        CREATED BY                                      SIZE
        4e1f7a9b2c3d   20 hours ago   COPY /app /usr/share/nginx/html # buildkit      1.37GB
        <missing>      3 weeks ago    CMD ["nginx" "-g" "daemon off;"]                0B
        <missing>      3 weeks ago    /bin/sh -c #(nop) ADD file:...                  48.6MB
    - task: "The whole `/app` (with `node_modules`) is copied into nginx. First check what the build context ignores."
      accept: ["^cat \\.dockerignore$"]
      solution: cat .dockerignore
      output: ".git"
    - task: "**Append** `node_modules` to `.dockerignore` (don't overwrite the file)."
      accept: ["^(echo|printf) (-e )?['\"]?(\\\\n)?node_modules/?(\\\\n)?['\"]? >> ?\\.dockerignore$"]
      solution: echo "node_modules" >> .dockerignore
      tool: [echo, printf, cat]
      wrong:
        - match: "[^>]> ?\\.dockerignore$"
          output: "# single > overwrote the file — .git is no longer ignored. Use >>"
      output: ""
    - task: "Rebuild as `acme/web:2.1`. (The Dockerfile's last COPY should also take only `/app/dist` — assume a teammate just pushed that fix.)"
      accept: [{ all: ["^docker (buildx )?build\\b", "(-t|--tag)[ =]?acme/web:2\\.1\\b", "\\s\\.$|\\s\\.\\s"] }]
      solution: docker build -t acme/web:2.1 .
      tool: [docker build, docker buildx]
      hint: "`docker build -t <name:tag> <context>` — the context is the current directory."
      output: |
        [+] Building 24.6s (12/12) FINISHED
         => [internal] load .dockerignore                                    0.0s
         => [internal] load build context                                    0.2s
         => => transferring context: 1.84MB                                  0.1s
         => exporting to image                                               0.3s
         => => naming to docker.io/acme/web:2.1                              0.0s
    - task: "Compare the sizes again."
      accept: ["^docker (images|image ls)\\b.*acme/web"]
      solution: docker images acme/web
      output: |
        REPOSITORY   TAG   IMAGE ID       CREATED          SIZE
        acme/web     2.1   9b8c7d6e5f4a   10 seconds ago   52.3MB
        acme/web     2.0   4e1f7a9b2c3d   20 hours ago     1.42GB
  explanation: "`docker history` points at the fat layer. A missing `.dockerignore` entry sends `node_modules` into the build context (slow builds), and copying the whole work dir into the runtime stage ships it. Ignore build junk, copy only the build output (`/app/dist`), and watch for `>` vs `>>` — overwriting `.dockerignore` silently starts shipping `.git`."
